<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Granit: Kaçış Destanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sert, askeri, gergin — bir hapishane kaçışı
   IDEA: mahkûm sicil dosyası ve hapishane uyarı tabelaları; kartlar damgalı dosya sayfaları gibi
   PICTURE: oyunun 3D arenası tüm ekranı kaplar, arayüz kenarlara çekilir
   COLOUR and TYPE: kömür siyahı zemin, mahkûm turuncusu ana renk, alarm kırmızısı yalnız boss için; Black Ops One başlıklar, Barlow Condensed metin
   LAYOUT: tam ekran sahne; üstte bölüm ve öldürme sayacı, altta can ve deneyim, seçim kartları ortada */
:root{--bg:#0e0f10;--ink:#eeeae4;--org:#ff7a1a;--red:#e8333a;--mut:#9a958e;--panel:rgba(16,17,19,.92);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:17px/1.45 "Barlow Condensed",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.ttl{font-family:"Black Ops One",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,92vw);text-align:center}
#lvlname{font-size:16px;font-weight:700;text-shadow:0 2px 4px #000}
#lvlname b{color:var(--org)}
.bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--org);transition:width .15s}
.bar span{position:absolute;inset:0;font-size:13px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
#bossbar{margin-top:10px;display:none}
#bossbar.on{display:block}#allybar{margin-top:8px;display:none}#allybar.on{display:block}#allyname{font-weight:700;color:#d0a0ff;font-size:15px;text-shadow:0 1px 3px #000}#allybar .bar{height:10px}#allybar .bar i{background:linear-gradient(90deg,#6a3aaa,#c080ff)}
#bossname{font-family:"Black Ops One",Impact,sans-serif;color:#ff6b6b;font-size:20px;text-shadow:0 2px 6px #000}
#bossbar .bar{height:14px}#bossbar .bar i{background:linear-gradient(90deg,#8e0f14,var(--red))}
.bottom{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,92vw);display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.badge{width:52px;height:52px;border-radius:50%;background:#1b1c1e;border:3px solid var(--org);display:grid;place-items:center;font-family:"Black Ops One",Impact,sans-serif;font-size:21px;box-shadow:0 3px 10px #000}
.bar.hp{height:20px;margin:0}.bar.hp i{background:linear-gradient(90deg,#b81f24,#ef4a3c)}.bar.hp span{line-height:19px}
.bar.xp{height:8px;margin-top:5px}.bar.xp i{background:#7bd3ff}
#wname{grid-column:2;font-size:14px;color:#d5cfc6;text-shadow:0 1px 3px #000;margin-top:-4px}
.tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);pointer-events:auto;font-weight:700;font-size:18px}
#pauseBtn{right:12px}#muteBtn{right:62px}
#warn{position:absolute;top:30%;left:0;right:0;text-align:center;font-family:"Black Ops One",Impact,sans-serif;font-size:clamp(26px,6vw,52px);color:var(--org);text-shadow:0 3px 12px #000;opacity:0;transition:opacity .3s}
#warn.on{opacity:1}#warn.red{color:#ff4a4a}
#spot{position:absolute;top:96px;left:0;right:0;text-align:center;color:#ffe066;font-weight:700;font-size:18px;text-shadow:0 2px 4px #000;display:none}
#vign{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(220,20,20,.85);opacity:0;transition:opacity .25s}
#flash{position:fixed;inset:0;pointer-events:none;background:#c8fff2;opacity:0;transition:opacity 1.2s}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,122,26,.75)}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,7,8,.55);overflow:auto}
#ov.on{display:flex}
#ov.tl{background:linear-gradient(90deg,rgba(6,7,8,.8),rgba(6,7,8,.2) 70%)}@media(min-width:900px){#ov.tl{justify-content:flex-start;padding-left:5vw}#ov.tl .card{margin:auto 0}}
#ov.clear{background:transparent;pointer-events:none}#ov.clear>*{pointer-events:auto}
.card{width:min(620px,100%);background:var(--panel);border:1px solid #2d2f33;border-top:6px solid var(--org);padding:clamp(20px,4vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
.card.boss{border-top-color:var(--red)}
.card h1{font-size:clamp(40px,9vw,68px);line-height:1;margin:0 0 4px;color:var(--org)}
.card h2{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.card .boss h2,.card.boss h2{color:#ff5a5a}
.card p{margin:0 0 12px;color:#d7d2ca}
.kick{font-size:15px;font-weight:700;color:var(--org);margin-bottom:6px}
.card.boss .kick{color:#ff6b6b}
.file{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:15px;border:1px dashed #4a4c50;padding:10px 12px;margin:12px 0 16px;color:#c9c3ba}
.file b{color:var(--ink)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Black Ops One",Impact,sans-serif;padding:2px 10px;transform:rotate(-4deg);font-size:18px;margin-bottom:10px}
.feat{display:flex;gap:10px;align-items:flex-start;background:#1c1d20;border-left:4px solid #ffd23f;padding:9px 12px;margin:0 0 8px;font-size:16px}
.feat b{color:#ffd23f;white-space:nowrap;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{min-height:48px;padding:0 22px;border:0;border-radius:4px;background:var(--org);color:#16130f;font-weight:700;font-size:19px}
.btn.alt{background:#2a2c30;color:var(--ink);border:1px solid #44474c}
.btn:focus-visible,.pick:focus-visible{outline:3px solid #fff;outline-offset:2px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.pick{text-align:left;background:#1b1c1f;border:2px solid #34373b;border-radius:6px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.pick:hover{border-color:var(--org);background:#222327}
.pick .ic{width:42px;height:42px}
.pick b{font-size:20px;line-height:1.1}
.pick small{font-size:15px;color:#c2bcb2}
.pick em{font-style:normal;font-size:13px;color:var(--org);margin-top:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:#bdb7ad;margin:6px 0 4px}
.stats b{color:var(--ink)}
.parts{display:grid;gap:12px;margin-top:14px}.part{background:#1b1c1f;border:1px solid #34373b;border-left:4px solid var(--org);padding:14px 16px}.part.p2{border-left-color:#40c8ff}.part b{font-size:23px;display:block;line-height:1.15}.part p{font-size:16px;margin:4px 0 0}.pk{font-size:14px;color:var(--org);font-weight:700}.part.p2 .pk{color:#6fd6ff}#ov.tl .card{width:min(860px,100%)}.part.p3{border-left-color:#ff4a3a}.part.p4{border-left-color:#c080ff}.part.p5{border-left-color:#8ac040}.part.p5 .pk{color:#a8d860}.part.p4 .pk{color:#d0a0ff}.part.p3 .pk{color:#ff7a6a}.parts{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}.part .btns{margin-top:10px}
.hint{font-size:14px;color:var(--mut);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:14px;background:#26282b;border-radius:3px;padding:2px 8px}
#mini{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;width:140px;height:140px;border-radius:8px;background:rgba(8,9,10,.62);border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(0,0,0,.5)}
@media(max-width:760px){#mini{top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 104px);left:10px;width:96px;height:96px}}
#ov.lux{background:radial-gradient(ellipse at 50% 40%,rgba(10,12,16,.55),rgba(4,5,6,.9))}
.lu{width:min(900px,100%);margin:auto;padding:4px}
.lu-h{display:flex;align-items:center;gap:16px;margin-bottom:6px}.lu-h h2{font-size:clamp(28px,5vw,42px);margin:0;line-height:1.05}
.lvb{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:"Black Ops One",Impact,sans-serif;font-size:28px;color:#16130f;background:radial-gradient(circle at 35% 30%,#ffd39a,#ff7a1a 60%,#a8410a);box-shadow:0 0 0 4px rgba(255,122,26,.25),0 0 30px rgba(255,122,26,.45)}
.lvb.mk{font-size:20px}
.sub{color:#cfc9bf;margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.sk{position:relative;text-align:left;display:flex;flex-direction:column;gap:7px;padding:14px 16px 16px;min-height:300px;border-radius:10px;border:1px solid #33363b;border-top:5px solid var(--c);background:linear-gradient(180deg,#1d1f23,#141518);box-shadow:0 14px 34px rgba(0,0,0,.55);transition:transform .15s,box-shadow .15s,border-color .15s;animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.sk:hover,.sk:focus-visible{transform:translateY(-6px);border-color:var(--c);box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 1px var(--c)}
.sk-top{display:flex;justify-content:space-between;align-items:center}
.cat{font-size:13px;font-weight:700;color:var(--c)}
.key{width:24px;height:24px;border-radius:5px;border:1px solid #4a4d52;display:grid;place-items:center;font-size:13px;color:#bdb7ad}
.icw{align-self:center;width:96px;height:96px;margin:6px 0 4px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,0) 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.icw.wide{width:120px;border-radius:14px}
.icw .ico{width:56px;height:56px;filter:drop-shadow(0 0 10px var(--c))}
.icw.wide .ico{width:84px}
.sk b{font-size:22px;line-height:1.1}
.sk small{font-size:16px;color:#c9c3b9}
.pv{font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.06);border-radius:5px;padding:5px 8px;margin-top:auto}
.pips{display:flex;gap:4px;flex-wrap:wrap}.pips i{width:14px;height:6px;border-radius:2px;background:#34373b}.pips i.on{background:var(--c)}
.lvn{font-size:13px;color:#a7a197}
.rar{align-self:center;font-size:13px;font-weight:700;color:#1a1408;background:linear-gradient(90deg,#ffd76a,#fff1b8,#ffd76a);background-size:200% 100%;border-radius:20px;padding:2px 10px;animation:shine 2s linear infinite}
.sk.epic{border-color:#8a7232;border-top-color:#ffd76a;background:linear-gradient(180deg,#2a2414,#16140e);box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 26px rgba(255,215,106,.18)}
.sk.epic .icw{color:#ffd76a}
.lu-f{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.build{display:flex;flex-wrap:wrap;gap:6px}
.bc{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;background:#1d1f23;border:1px solid #33363b;border-left:3px solid var(--c);border-radius:4px;padding:3px 8px 3px 5px}
.bc .bi{width:18px;height:18px}.bc0{font-size:14px;color:#8f8a82}
.stats2{display:grid;gap:6px;margin-top:auto}
.st{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px;font-size:14px;color:#c9c3b9}
.st i{height:8px;border-radius:4px;background:#2c2f33;overflow:hidden}.st i b{display:block;height:100%;background:var(--c);border-radius:4px}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
@keyframes shine{to{background-position:-200% 0}}
@media(max-width:700px){.cards{grid-template-columns:minmax(0,1fr);gap:10px}.sk{min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:12px;row-gap:3px;padding:12px}
 .sk>*{grid-column:2}.sk .icw{grid-column:1;grid-row:1/span 5;width:60px;height:60px;margin:0;align-self:start}.icw .ico{width:36px;height:36px}.icw.wide{width:60px}.icw.wide .ico{width:48px}.sk b{font-size:19px}.lvb{width:52px;height:52px;font-size:22px}.key{display:none}}
@media(prefers-reduced-motion:reduce){.sk,.rar{animation:none}}
#gold{position:absolute;top:max(10px,env(safe-area-inset-top));right:112px;height:44px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,201,58,.4);font-weight:700;font-size:18px;color:#ffd970}
.ci{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc93a 55%,#a8730a);box-shadow:0 0 0 1px #6a4a00;vertical-align:-2px;margin-right:4px}.ci.big{width:38px;height:38px;margin:0}
.lvb.coin{background:#1d1f23;box-shadow:0 0 0 4px rgba(255,201,58,.25),0 0 30px rgba(255,201,58,.35)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:14px}
.mc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:#1b1c1f;border:1px solid #33363b;border-left:4px solid var(--c)}
.mc.on{background:linear-gradient(90deg,rgba(255,255,255,.06),#1b1c1f);box-shadow:0 0 0 1px var(--c) inset}.mc.lock{opacity:.85;border-left-color:#4a4d52}
.mc .mi{width:40px;height:40px}.mt{display:flex;flex-direction:column;gap:2px}.mt b{font-size:17px;line-height:1.1}.mt small{font-size:14px;color:#bdb7ad}.mcat{font-size:12px;color:var(--c);font-weight:700}
.btn.sm{min-height:40px;padding:0 14px;font-size:16px}.btn:disabled{opacity:.4;cursor:not-allowed}
.eqrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:14px;color:#a7a197}
@media(max-width:600px){#gold{top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:10px;height:34px;font-size:15px;padding:0 9px}.feat{flex-wrap:wrap}.feat b{white-space:normal}.mc{grid-template-columns:36px minmax(0,1fr);}.mc .btn{grid-column:1/-1}}
#serumw{position:relative;margin-bottom:5px}#serumt{display:block;font-size:13px;font-weight:700;color:#ff8a9a;text-shadow:0 1px 2px #000;margin-bottom:2px}
#serum{position:relative;height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden}#serum i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#8a0f20,#ff3b5a)}
#serum.rdy{box-shadow:0 0 10px #ff3b5a;animation:pulse 1s ease-in-out infinite}
#serumBtn{position:absolute;right:16px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 6px);width:72px;height:72px;border-radius:50%;pointer-events:auto;border:2px solid rgba(255,255,255,.3);color:#fff;background:conic-gradient(#ff3b5a var(--p,0%),rgba(0,0,0,.6) 0);box-shadow:0 4px 14px rgba(0,0,0,.6);display:grid;place-items:center}
#serumBtn b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#16171a;font-size:12px;letter-spacing:.02em}
#serumBtn.rdy{border-color:#ff8a9a;animation:pulse 1s ease-in-out infinite}#serumBtn.rdy b{background:#5a0a18}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 22px #ff3b5a}}
@media(max-width:600px){#serumBtn{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 104px);right:12px}}
#load{position:fixed;inset:0;display:grid;place-items:center;font-family:"Black Ops One",Impact,sans-serif;color:var(--org);font-size:22px}
@media(max-width:600px){.picks{grid-template-columns:minmax(0,1fr)}.pick{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}.pick em{margin-top:0;width:100%}.pick .ic{width:34px;height:34px}.card p{font-size:16px}}
@media(prefers-reduced-motion:reduce){.bar i,#warn,#vign,#flash{transition:none}}

/* ===== çizgi roman stili ===== */
#comic{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.6px);background-size:5px 5px;mix-blend-mode:multiply;opacity:.22;box-shadow:inset 0 0 0 5px #0a090b,inset 0 0 120px rgba(0,0,0,.55)}
#sfxl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sfx{position:absolute;font-family:Bangers,"Black Ops One",Impact,sans-serif;font-size:var(--fs,34px);letter-spacing:1px;color:var(--c,#ffd23a);-webkit-text-stroke:2px #0a090b;paint-order:stroke fill;text-shadow:3px 3px 0 #0a090b;white-space:nowrap;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(.2);animation:sfxp .8s ease-out forwards}
@keyframes sfxp{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.2);opacity:1}18%{transform:translate(-50%,-60%) rotate(var(--r)) scale(1.18)}30%{transform:translate(-50%,-62%) rotate(var(--r)) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-85%) rotate(var(--r)) scale(.95);opacity:0}}
.card{border:3px solid #0a090b;border-top:7px solid var(--org);box-shadow:8px 8px 0 #0a090b,0 20px 60px rgba(0,0,0,.5)}
.sk{border:3px solid #0a090b!important;border-top:6px solid var(--c)!important;box-shadow:6px 6px 0 #0a090b}
.btn{border:3px solid #0a090b;box-shadow:3px 3px 0 #0a090b;font-family:Bangers,"Barlow Condensed",sans-serif;letter-spacing:1px;font-size:21px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0a090b}
.card h1{font-family:Bangers,"Black Ops One",Impact,sans-serif;letter-spacing:2px;-webkit-text-stroke:1.5px #0a090b;text-shadow:4px 4px 0 #0a090b}
#warn{font-family:Bangers,"Black Ops One",Impact,sans-serif;letter-spacing:3px;-webkit-text-stroke:2px #0a090b;text-shadow:5px 5px 0 #0a090b}
@media(prefers-reduced-motion:reduce){.sfx{animation-duration:.01s}}

/* ===== çizgi roman sayfası ===== */
#ov.comicov{background:#efe4cc radial-gradient(rgba(0,0,0,.16) 1.2px,transparent 1.8px) 0 0/7px 7px}
.cpage{width:min(880px,100%);display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:auto;transform:rotate(-.3deg)}
.cpan{position:relative;border:4px solid #0a090b;background:#222;overflow:hidden;box-shadow:6px 6px 0 #0a090b;opacity:0;animation:cpin .45s cubic-bezier(.2,1.5,.4,1) forwards}
.cpan::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.5px) 0 0/5px 5px;mix-blend-mode:multiply;opacity:.35}
.cp1{grid-column:1/3;height:clamp(160px,27vh,240px)}.cp2,.cp3{height:clamp(190px,34vh,300px)}
.cp2{animation-delay:.45s;transform-origin:left}.cp3{animation-delay:1s;transform-origin:right}
@keyframes cpin{0%{opacity:0;transform:scale(.85) rotate(-2deg)}100%{opacity:1;transform:none}}
.cart,.cart svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.ccap b{display:block;font:400 19px/1.1 Bangers,"Black Ops One",Impact,sans-serif;letter-spacing:1px;margin-bottom:2px}
