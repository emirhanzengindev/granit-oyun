<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Granit: Kara Sektör'den Kaçış</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sert, askeri, gergin — bir hapishane kaçışı
   IDEA: mahkûm sicil dosyası ve hapishane uyarı tabelaları; kartlar damgalı dosya sayfaları gibi
   PICTURE: oyunun 3D arenası tüm ekranı kaplar, arayüz kenarlara çekilir
   COLOUR and TYPE: kömür siyahı zemin, mahkûm turuncusu ana renk, alarm kırmızısı yalnız boss için; Black Ops One başlıklar, Barlow Condensed metin
   LAYOUT: tam ekran sahne; üstte bölüm ve öldürme sayacı, altta can ve deneyim, seçim kartları ortada */
:root{--bg:#0e0f10;--ink:#eeeae4;--org:#ff7a1a;--red:#e8333a;--mut:#9a958e;--panel:rgba(16,17,19,.92);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font:17px/1.45 "Barlow Condensed",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.ttl{font-family:"Black Ops One",Impact,sans-serif;font-weight:400;letter-spacing:.01em}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,92vw);text-align:center}
#lvlname{font-size:16px;font-weight:700;text-shadow:0 2px 4px #000}
#lvlname b{color:var(--org)}
.bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--org);transition:width .15s}
.bar span{position:absolute;inset:0;font-size:13px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
#bossbar{margin-top:10px;display:none}
#bossbar.on{display:block}
#bossname{font-family:"Black Ops One",Impact,sans-serif;color:#ff6b6b;font-size:20px;text-shadow:0 2px 6px #000}
#bossbar .bar{height:14px}#bossbar .bar i{background:linear-gradient(90deg,#8e0f14,var(--red))}
.bottom{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,92vw);display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.badge{width:52px;height:52px;border-radius:50%;background:#1b1c1e;border:3px solid var(--org);display:grid;place-items:center;font-family:"Black Ops One",Impact,sans-serif;font-size:21px;box-shadow:0 3px 10px #000}
.bar.hp{height:20px;margin:0}.bar.hp i{background:linear-gradient(90deg,#b81f24,#ef4a3c)}.bar.hp span{line-height:19px}
.bar.xp{height:8px;margin-top:5px}.bar.xp i{background:#7bd3ff}
#wname{grid-column:2;font-size:14px;color:#d5cfc6;text-shadow:0 1px 3px #000;margin-top:-4px}
.tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);pointer-events:auto;font-weight:700;font-size:18px}
#pauseBtn{right:12px}#muteBtn{right:62px}
#warn{position:absolute;top:30%;left:0;right:0;text-align:center;font-family:"Black Ops One",Impact,sans-serif;font-size:clamp(26px,6vw,52px);color:var(--org);text-shadow:0 3px 12px #000;opacity:0;transition:opacity .3s}
#warn.on{opacity:1}#warn.red{color:#ff4a4a}
#spot{position:absolute;top:96px;left:0;right:0;text-align:center;color:#ffe066;font-weight:700;font-size:18px;text-shadow:0 2px 4px #000;display:none}
#vign{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(220,20,20,.85);opacity:0;transition:opacity .25s}
#flash{position:fixed;inset:0;pointer-events:none;background:#c8fff2;opacity:0;transition:opacity 1.2s}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,122,26,.75)}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,7,8,.55);overflow:auto}
#ov.on{display:flex}
#ov.tl{background:linear-gradient(90deg,rgba(6,7,8,.8),rgba(6,7,8,.2) 70%)}@media(min-width:900px){#ov.tl{justify-content:flex-start;padding-left:5vw}#ov.tl .card{margin:auto 0}}
#ov.clear{background:transparent;pointer-events:none}#ov.clear>*{pointer-events:auto}
.card{width:min(620px,100%);background:var(--panel);border:1px solid #2d2f33;border-top:6px solid var(--org);padding:clamp(20px,4vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.6);margin:auto}
.card.boss{border-top-color:var(--red)}
.card h1{font-size:clamp(40px,9vw,68px);line-height:1;margin:0 0 4px;color:var(--org)}
.card h2{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.card .boss h2,.card.boss h2{color:#ff5a5a}
.card p{margin:0 0 12px;color:#d7d2ca}
.kick{font-size:15px;font-weight:700;color:var(--org);margin-bottom:6px}
.card.boss .kick{color:#ff6b6b}
.file{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:15px;border:1px dashed #4a4c50;padding:10px 12px;margin:12px 0 16px;color:#c9c3ba}
.file b{color:var(--ink)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Black Ops One",Impact,sans-serif;padding:2px 10px;transform:rotate(-4deg);font-size:18px;margin-bottom:10px}
.feat{display:flex;gap:10px;align-items:flex-start;background:#1c1d20;border-left:4px solid #ffd23f;padding:9px 12px;margin:0 0 8px;font-size:16px}
.feat b{color:#ffd23f;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{min-height:48px;padding:0 22px;border:0;border-radius:4px;background:var(--org);color:#16130f;font-weight:700;font-size:19px}
.btn.alt{background:#2a2c30;color:var(--ink);border:1px solid #44474c}
.btn:focus-visible,.pick:focus-visible{outline:3px solid #fff;outline-offset:2px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.pick{text-align:left;background:#1b1c1f;border:2px solid #34373b;border-radius:6px;padding:14px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.pick:hover{border-color:var(--org);background:#222327}
.pick .ic{width:42px;height:42px}
.pick b{font-size:20px;line-height:1.1}
.pick small{font-size:15px;color:#c2bcb2}
.pick em{font-style:normal;font-size:13px;color:var(--org);margin-top:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:#bdb7ad;margin:6px 0 4px}
.stats b{color:var(--ink)}
.hint{font-size:14px;color:var(--mut);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips span{font-size:14px;background:#26282b;border-radius:3px;padding:2px 8px}
#load{position:fixed;inset:0;display:grid;place-items:center;font-family:"Black Ops One",Impact,sans-serif;color:var(--org);font-size:22px}
@media(max-width:600px){.picks{grid-template-columns:minmax(0,1fr)}.pick{min-height:0;flex-direction:row;align-items:center;flex-wrap:wrap}.pick em{margin-top:0;width:100%}.pick .ic{width:34px;height:34px}.card p{font-size:16px}}
@media(prefers-reduced-motion:reduce){.bar i,#warn,#vign,#flash{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">YÜKLENİYOR…</div>
<div id="hud">
  <div class="top">
    <div id="lvlname"></div>
    <div class="bar" id="killbar"><i></i><span></span></div>
    <div id="bossbar"><div id="bossname"></div><div class="bar"><i></i></div></div>
  </div>
  <div id="spot">⚠ PROJEKTÖR SENİ GÖRDÜ — DÜŞMANLAR HIZLANDI</div>
  <div id="warn"></div>
  <div class="bottom">
    <div class="badge" id="plvl">1</div>
    <div><div class="bar hp" id="hpbar"><i></i><span></span></div><div class="bar xp" id="xpbar"><i></i></div></div>
    <div id="wname"></div>
  </div>
  <button class="tbtn" id="muteBtn" aria-label="Sesi aç/kapat">♪</button>
  <button class="tbtn" id="pauseBtn" aria-label="Duraklat">II</button>
</div>
<div id="vign"></div>
<div id="flash"></div>
<div id="joy"><i></i></div>
<div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const E=(c,i)=>M(c,{emissive:c,emissiveIntensity:i||1.2});
const BX=(w,h,d,m)=>new THREE.Mesh(geo('b'+w+'_'+h+'_'+d,()=>new THREE.BoxGeometry(w,h,d)),m);
const SP=(r,m,s)=>new THREE.Mesh(geo('s'+r+'_'+(s||12),()=>new THREE.SphereGeometry(r,s||12,Math.max(6,(s||12)-3))),m);
const CY=(a,b,h,m,s)=>new THREE.Mesh(geo('c'+a+'_'+b+'_'+h+'_'+(s||12),()=>new THREE.CylinderGeometry(a,b,h,s||12)),m);

const at=(o,x,y,z,rx,ry,rz)=>{o.position.set(x,y,z);if(rx)o.rotation.x=rx;if(ry)o.rotation.y=ry;if(rz)o.rotation.z=rz;return o};
const sc=(o,x,y,z)=>{o.scale.set(x,y===undefined?x:y,z===undefined?x:z);return o};
const shade=o=>{(o.isObject3D?o:o.g).traverse(c=>{if(c.isMesh)c.castShadow=true});return o};

function humanoid(o){
 const g=new THREE.Group(),k=o.bulk||1,legs=[],arms=[];
 for(const s of[-1,1]){
  const hip=at(new THREE.Group(),.21*s*k,.86,0);
  hip.add(at(BX(.3*k,.64,.32*k,M(o.pants)),0,-.3,0));
  hip.add(at(BX(.33*k,.22,.44*k,M(o.boots||0x1d1d1f)),0,-.74,.05));
  g.add(hip);legs.push(hip);
  const sh=at(new THREE.Group(),.56*s*k,1.62,0);
  sh.add(at(BX(.27*k,.72,.29*k,M(o.arm||o.skin)),0,-.33,0));
  sh.add(at(BX(.22*k,.2,.24*k,M(o.skin)),0,-.76,0));
  g.add(sh);arms.push(sh);
 }
 g.add(at(BX(.88*k,.84,.52*k,M(o.shirt)),0,1.3,0));
 g.add(at(BX(.7*k,.22,.44*k,M(o.belt||0x2a2520)),0,.9,0));
 const head=at(new THREE.Group(),0,2,0);
 head.add(BX(.46,.5,.46,M(o.skin)));
 g.add(head);
 return {g,legs,arms,head};
}

function tierMul(){const t=tierOf();return{hp:Math.pow(2.3,t)*(1+.05*((LVL-1)%5)),dmg:1+.35*t,spd:1+.05*t}}
function spawnEnemy(type,x,z){const d=ET[type],tm=tierMul(),b=d.b();b.g.position.set(x,0,z);scene.add(b.g);
 const e=Object.assign(b,{type,d,x,z,hp:d.hp*tm.hp,max:d.hp*tm.hp,spd:d.spd*tm.spd*R(.9,1.1),dmg:d.dmg*tm.dmg,r:d.r,atk:R(.2,1),fire:R(1,2.5),ph:R(0,6),hit:0,bcd:0,face:0,born:.4});
 enemies.push(e);return e}
function spawnWeights(){const w={guard:5},h=m=>curMods.includes(m),t=tierOf();
 if(h('runners'))w.runner=4;if(h('tanks'))w.tank=1.4;if(h('shooters'))w.shooter=2.6;if(h('exploders'))w.exploder=2.4;if(h('splitters'))w.splitter=2;if(h('robots'))w.robot=3.2;if(h('swarm')){w.runner=(w.runner||0)+3;w.mini=4}
 if(t>=1)w.runner=(w.runner||0)+1;if(t>=2){w.shooter=(w.shooter||0)+.7;w.tank=(w.tank||0)+.5}if(t>=4)w.robot=(w.robot||0)+.8;return w}

function nearest(x,z,range,skip){let best=null,bd=range*range;for(const e of enemies){if(skip&&skip.has(e))continue;const d=(e.x-x)**2+(e.z-z)**2;if(d<bd){bd=d;best=e}}
 if(boss&&boss.alive&&!(skip&&skip.has(boss))&&!boss.hidden){const d=(boss.x-x)**2+(boss.z-z)**2;if(d<bd)best=boss}return best}

function updBoss(dt){const B=boss;if(!B||!B.alive)return;
 const rage=B.hp<B.max*.5?.7:1,dx=P.x-B.x,dz=P.z-B.z,dist=Math.hypot(dx,dz)||1;
 const ang=Math.atan2(dx,dz);const spd=B.d.spd*(1+.04*B.b)*(rage<1?1.2:1);
 B.t-=dt;B.atk-=dt;
 const chase=m=>{B.x+=dx/dist*spd*m*dt;B.z+=dz/dist*spd*m*dt;B.face=ang};
 switch(B.st){
  case 'idle':chase(dist>3?1:0);if(B.t<=0){const p=pick(B.d.pat);startPat(p,rage)}break;
  case 'charge-tel':B.face=B.cang;B.g.position.x=B.x+Math.sin(B.t*60)*.08;if(B.t<=0){B.st='charge';B.t=.62;B.ring&&(B.ring.done=1)}break;
  case 'charge':B.x+=Math.sin(B.cang)*22*dt;B.z+=Math.cos(B.cang)*22*dt;if(Math.abs(B.x)>HALF-1||Math.abs(B.z)>HALF-1){B.t=0;shake=.5}
   if(dist<B.r+.6&&B.atk<=0){hurtP(bdmg(.2));B.atk=.6}if(B.t<=0)idle(rage);break;
  case 'slam':if(B.t<=0){boomFx(B.x,B.z,6.5,0xff5030);if(Math.hypot(P.x-B.x,P.z-B.z)<6.5)hurtP(bdmg(.24));shake=.7;idle(rage)}break;
  case 'radial':B.face=ang;if(B.t<=0){const n=12+B.b*2;const off=R(0,1);for(let i=0;i<n;i++)eBullet(B.x,B.z,(i+off)/n*TAU,8+B.b*.5,bdmg(.07),{col:0xff4ad0,big:1});B.burst--;B.t=.5;snd('eshot');if(B.burst<=0)idle(rage)}break;
  case 'spiral':B.face+=dt*3;B.cd-=dt;if(B.cd<=0){B.cd=.07;B.ang+=.37;for(let k=0;k<(B.b>=5?3:2);k++)eBullet(B.x,B.z,B.ang+k*TAU/(B.b>=5?3:2),9,bdmg(.06),{col:0xffa020})}if(B.t<=0)idle(rage);break;
  case 'tele-out':B.g.scale.setScalar(Math.max(.01,B.s*B.t/.5));if(B.t<=0){B.hidden=true;const a=R(0,TAU);B.x=clamp(P.x+Math.sin(a)*6,-20,20);B.z=clamp(P.z+Math.cos(a)*6,-20,20);teleRing(B.x,B.z,B.r+1,.6,0x40f0ff);B.st='tele-in';B.t=.6}break;
  case 'tele-in':B.g.scale.setScalar(B.s*(1-B.t/.6)+.01);if(B.t<=0){B.hidden=false;B.g.scale.setScalar(B.s);const n=14+B.b*2;for(let i=0;i<n;i++)eBullet(B.x,B.z,i/n*TAU,9,bdmg(.07),{col:0x40f0ff,big:1});idle(rage)}break;
  default:idle(rage)}
 B.x=clamp(B.x,-HALF+1,HALF-1);B.z=clamp(B.z,-HALF+1,HALF-1);
 if(B.st!=='charge'&&!B.hidden&&dist<B.r+.6&&B.atk<=0){hurtP(bdmg(.12));B.atk=.8}
 B.g.position.set(B.st==='charge-tel'?B.g.position.x:B.x,0,B.z);B.g.rotation.y=B.face;
 if(B.hit>0){B.hit-=dt;B.g.scale.setScalar(B.s*(1+B.hit*.6))}else if(!B.st.startsWith('tele'))B.g.scale.setScalar(B.s);
 const tm=performance.now()/1000;for(const w of B.w){if(w.spin)w.o.rotation.y=tm*w.spin;else w.o.rotation[w.ax]=w.b+Math.sin(tm*w.spd+w.ph)*w.amp}
 if(B.b===3)B.g.position.y=Math.sin(tm*1.4)*.3;
 if(B.b<6||true){bossTrickle-=dt;if(bossTrickle<=0&&enemies.length<5){bossTrickle=4;const[x,z]=edgeSpot();spawnEnemy(B.b>=4?pick(['guard','runner','shooter']):pick(['guard','runner']),x,z)}}}
function idle(rage){boss.st='idle';boss.t=R(1.6,2.4)*(1-.06*boss.b)*rage}
function startPat(p,rage){const B=boss;
 if(p==='charge'){B.st='charge-tel';B.t=.75;B.cang=Math.atan2(P.x-B.x,P.z-B.z);const l=new THREE.Mesh(geo('lane',()=>new THREE.PlaneGeometry(1,1)),M(0xff2020,{transparent:true,opacity:.35,emissive:0xff2020,emissiveIntensity:1,depthWrite:false}).clone());l.rotation.x=-Math.PI/2;l.rotation.z=B.cang;l.scale.set(B.r*1.6,14,1);l.position.set(B.x+Math.sin(B.cang)*7,.06,B.z+Math.cos(B.cang)*7);scene.add(l);fx.push({m:l,t:0,d:.75,lane:1});B.ring={done:0}}
 else if(p==='slam'){B.st='slam';B.t=1.05;teleRing(B.x,B.z,6.5,1.05)}
 else if(p==='radial'){B.st='radial';B.burst=2+(B.b>=4?1:0);B.t=.35}
 else if(p==='spiral'){B.st='spiral';B.t=2.2;B.cd=0}
 else if(p==='spawn'){const n=3+B.b;for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(B.b===2?'exploder':B.b===3?'runner':pick(['runner','exploder','mini','shooter']),clamp(B.x+Math.sin(a)*3,-21,21),clamp(B.z+Math.cos(a)*3,-21,21))}warn('TAKVİYE!');idle(rage)}
 else if(p==='acid'){for(let i=0;i<3+Math.floor(B.b/2);i++){const x=clamp(P.x+(i?R(-5,5):0),-21,21),z=clamp(P.z+(i?R(-5,5):0),-21,21);const o=teleRing(x,z,2.6,1.1,0x7aff3a);o.acid=1}idle(rage)}
 else if(p==='teleport'){B.st='tele-out';B.t=.5}
 else if(p==='homing'){for(let i=0;i<3+Math.floor(B.b/3);i++)eBullet(B.x,B.z,B.face+(i-1.5)*.6,6.5,bdmg(.12),{col:0xff7020,big:1,home:2.4,life:5});snd('eshot');idle(rage)}
 else idle(rage)}

  if(d<.8){P.xp+=g.v;scene.remove(g.m);gems.splice(i,1);snd('gem');while(P.xp>=xpNeed()){P.xp-=xpNeed();P.lvl++;pendingLv++}}}
 for(let i=meds.length-1;i>=0;i--){const m=meds[i];m.g.rotation.y+=dt*2;if(Math.hypot(P.x-m.x,P.z-m.z)<1.1){P.hp=Math.min(P.maxHp,P.hp+P.maxHp*.25);scene.remove(m.g);meds.splice(i,1);snd('lvl')}}
 // parçacık ve efekt
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=18*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.m.rotation.x+=dt*8;if(p.life<=0){scene.remove(p.m);parts.splice(i,1)}}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/f.d;if(!f.line&&!f.lane){f.m.scale.setScalar(f.r*(.3+.7*k));f.m.material.opacity=.7*(1-k)}else if(f.lane){f.m.material.opacity=.15+.35*Math.abs(Math.sin(f.t*20))}if(k>=1){scene.remove(f.m);fx.splice(i,1)}}
 for(let i=tele.length-1;i>=0;i--){const o=tele[i];o.t+=dt;const k=Math.min(1,o.t/o.d);o.f.scale.setScalar(o.r*k);o.m.material.opacity=.5+.4*Math.sin(o.t*18);

 // tehlikeler

 if(inPool){P.hp-=P.maxHp*.09*dt*(1-P.armor);if(Math.random()<dt*8)burst(P.x,.2,P.z,0x9cff3a,1,2);if(P.hp<=0&&state==='play'){P.hp=0;gameOver();return}}
 for(let i=mines.length-1;i>=0;i--){const m=mines[i];m.l.material=Math.sin(tm*6+m.ph)>0?EYE(0xff1a1a):M(0x330000);
  let trig=Math.hypot(P.x-m.x,P.z-m.z)<1.1;if(!trig)for(const e of enemies)if(Math.hypot(e.x-m.x,e.z-m.z)<e.r+.5){trig=true;break}

 for(const L of lasers){L.a+=dt*.65*L.s;L.pivot.rotation.y=L.a;L.cd-=dt;const dx=Math.cos(L.a),dz=-Math.sin(L.a);const px=P.x-L.x,pz=P.z-L.z;const proj=px*dx+pz*dz;
  if(proj>0&&proj<12.2){const perp=Math.abs(px*dz-pz*dx);if(perp<.62&&L.cd<=0){hurtP(P.maxHp*.14);L.cd=.5}}}

function updSpawn(dt){if(LV[LVL-1].b||clearing>0)return;spawnT-=dt*(spotted>0?2:1);

const hud={};

 const v={ln:`<b>Bölüm ${LVL}/30</b> · ${esc(L.t)}`,kp:L.b?(boss?Math.max(0,boss.hp/boss.max):1):Math.min(1,kills/target),kt:L.b?'':`Düşman ${Math.min(kills,target)} / ${target}`,
  hp:P.hp/P.maxHp,ht:`${Math.ceil(P.hp)} / ${P.maxHp}`,xp:P.xp/xpNeed(),lv:P.lvl,wn:`${W[P.weapon].n} Mk ${P.mk}`};
 const set=(k,f)=>{if(force||hud[k]!==v[k]){hud[k]=v[k];f(v[k])}};
 set('ln',x=>$('#lvlname').innerHTML=x);set('kt',x=>{$('#killbar span').textContent=x;$('#killbar').style.display=L.b?'none':'block'});
 set('kp',x=>{if(L.b)$('#bossbar .bar i').style.width=(x*100)+'%';else $('#killbar i').style.width=(x*100)+'%'});
 set('hp',x=>$('#hpbar i').style.width=(x*100)+'%');set('ht',x=>$('#hpbar span').textContent=x);set('xp',x=>$('#xpbar i').style.width=(x*100)+'%');
 set('lv',x=>$('#plvl').textContent=x);set('wn',x=>$('#wname').textContent=x)}

/* ================= ANA DÖNGÜ ================= */
let last=performance.now(),camA=0;const camPos=new THREE.Vector3(0,22,14);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'){levelTime+=dt;updPlayer(dt);if(state==='play')updEnemies(dt);if(state==='play')updBoss(dt);updBullets(dt);if(state==='play')updWorld(dt);if(state==='play')updSpawn(dt);
  if(bossDelay>0&&state==='play'){bossDelay-=dt;if(bossDelay<=0&&!boss)spawnBoss(LV[LVL-1].b)}
  if(clearing!==0&&state==='play'){clearing-=dt;if((clearing<=0&&gems.length===0)||clearing<-2){clearing=0;levelDone()}}
  if(pendingLv>0&&state==='play')levelUpScreen();
  updHud()}
 else if(state==='ending'||state==='end'){updEnding(dt);updWorldIdle(dt)}
 if(warnT>0){warnT-=dt;if(warnT<=0)$('#warn').className=''}
 // kamera
 const port=cam.aspect<1;const oy=port?30:22,oz=port?19:14;
 if(state==='title'){camA+=dt*.12;cam.position.set(Math.sin(camA)*11,5.5,Math.cos(camA)*11);const off=cam.aspect>1.15?3.4:0;cam.lookAt(-Math.cos(camA)*off,1.9,Math.sin(camA)*off);
  if(player){player.legs[0].rotation.x=player.legs[1].rotation.x=0;player.g.rotation.y=Math.sin(now/2000)*.4}}
 else{const tx=P?P.x:0,tz=P?P.z:0;let ty=0;if(state==='ending'||state==='end'){ty=Math.min(10,endT*.8)}
  camPos.lerp(new THREE.Vector3(tx,oy+(ty?ty*.6:0),tz+oz+(ty?ty*.4:0)),Math.min(1,dt*6));cam.position.copy(camPos);
  if(shake>0){cam.position.x+=R(-1,1)*shake*.6;cam.position.z+=R(-1,1)*shake*.6;shake=Math.max(0,shake-dt*1.6)}
  cam.lookAt(tx,1+ty,tz)}
 sun.position.set((P?P.x:0)+14,34,(P?P.z:0)+12);sun.target.position.set(P?P.x:0,0,P?P.z:0);
 renderer.render(scene,cam);requestAnimationFrame(frame)}
function updWorldIdle(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy-=18*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;if(p.life<=0){scene.remove(p.m);parts.splice(i,1)}}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/f.d;if(!f.line&&!f.lane){f.m.scale.setScalar(f.r*(.3+.7*k));f.m.material.opacity=.7*(1-k)}if(k>=1){scene.remove(f.m);fx.splice(i,1)}}
 for(let i=gems.length-1;i>=0;i--){scene.remove(gems[i].m);gems.splice(i,1)}}

P=newPlayer();titleScreen();requestAnimationFrame(frame);
